<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Engine tests</title>
<style>
  body { margin: 0; padding: 16px 20px; background: #202020; color: #dadada; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  #summary { font-weight: 600; padding: 8px 12px; border-radius: 6px; background: #161616; border: 1px solid #333; margin-bottom: 12px; }
  #summary.ok { border-color: #08b94e; } #summary.bad { border-color: #e93147; }
  .t { padding: 2px 8px; border-radius: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .t.pass::before { content: "PASS "; color: #08b94e; } .t.fail::before { content: "FAIL "; color: #e93147; }
  .t.fail { background: rgba(233,49,71,.12); }
  .t .err { color: #f38ba8; margin-left: 8px; }
  h2 { font-size: 13px; color: #999; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  #stage { position: absolute; left: -10000px; top: 0; width: 900px; height: 600px; }
  #stage > div { width: 900px; height: 600px; }
</style>
</head>
<body>
<h1>Mind Map engine — in-browser tests</h1>
<div id="summary">Running…</div>
<div id="out"></div>
<div id="stage"><div id="mm"></div><div id="gv"></div><div id="cv"></div></div>
<script type="module">
import { parseMarkdown, parseFrontmatter, renderInline, extractLinks, treeToMarkdown, setNodeText, insertChild, insertSibling, deleteNode, moveNode, toggleCheck, findNodeById, findNodeAtLine, flattenTree } from '../src/core/markdown.js';
import { layoutTree } from '../src/mindmap/layout.js';
import { MindMapView } from '../src/mindmap/renderer.js';
import { GraphView } from '../src/mindmap/graph.js';
import { CanvasView } from '../src/mindmap/canvas.js';
import { ForceSimulation } from '../src/mindmap/graph-sim.js';
import { exportSVG, exportPNG, exportMarkdown, exportOPML, exportFreeMind } from '../src/core/exporters.js';
import { readZip, opmlToMarkdown, freemindToMarkdown, xmindToMarkdown, mindmeisterToMarkdown, importFile, outlineTextToMarkdown, canvasToMarkdown } from '../src/core/importers.js';
import { generateBigMap, generateGraph, sampleCanvas } from '../dev/bigmap.js';

const out = document.getElementById('out');
const results = { pass: 0, fail: 0, failures: [] };
let section = null;
const group = name => { section = document.createElement('h2'); section.textContent = name; out.appendChild(section); };
async function test(name, fn) {
  const el = document.createElement('div'); el.className = 't'; el.textContent = name; out.appendChild(el);
  try { await fn(); el.classList.add('pass'); results.pass++; }
  catch (err) { el.classList.add('fail'); const e = document.createElement('span'); e.className = 'err'; e.textContent = err && err.message || String(err); el.appendChild(e); results.fail++; results.failures.push(name + ': ' + (err && err.message)); console.error(name, err); }
}
const assert = (c, m = 'assertion failed') => { if (!c) throw new Error(m); };
const eq = (a, b, m) => { if (a !== b) throw new Error(`${m || 'not equal'}: ${JSON.stringify(a)} !== ${JSON.stringify(b)}`); };
const deepEq = (a, b, m) => eq(JSON.stringify(a), JSON.stringify(b), m);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const structure = t => flattenTree(t).map(n => [n.type, n.text, n.depth]);

const MD = `---
title: Demo
tags: [a, b]
---
# Heading 1
Intro paragraph with [[Note|alias]] and #tag1.

## Sub A
- item 1 **bold**
  - [ ] todo child
  - [x] done child
- item 2 \`code\`
1. ordered
2. ordered two

\`\`\`js
console.log(1)
\`\`\`

| a | b |
|---|---|
| 1 | 2 |

## Sub B {color:#ff0000}
Para B
`;

// ───────────── parser ─────────────
group('markdown parser');
await test('frontmatter parsed and stripped', () => {
  const fm = parseFrontmatter(MD);
  eq(fm.data.title, 'Demo'); deepEq(fm.data.tags, ['a', 'b']); assert(fm.body.startsWith('# Heading 1'));
});
await test('headings nest by level, root from frontmatter title', () => {
  const t = parseMarkdown(MD);
  eq(t.type, 'root'); eq(t.text, 'Demo'); eq(t.children.length, 1);
  const h1 = t.children[0]; eq(h1.type, 'heading'); eq(h1.level, 1); eq(h1.depth, 1);
  eq(h1.children.map(c => c.type).join(','), 'paragraph,heading,heading');
});
await test('lists nest by indent; ordered and checkboxes', () => {
  const subA = parseMarkdown(MD).children[0].children[1];
  eq(subA.children[0].type, 'list'); eq(subA.children[0].children.length, 2);
  eq(subA.children[0].children[0].checked, false); eq(subA.children[0].children[1].checked, true);
  eq(subA.children[0].children[0].text, 'todo child');
  eq(subA.children[0].children[0].badges[0], 'todo'); eq(subA.children[0].children[1].badges[0], 'done');
  eq(subA.children[2].marker, '1.'); eq(subA.children[2].text, 'ordered');
  eq(subA.children[0].children[0].level, 2);
});
await test('fenced code and tables become single nodes with line ranges', () => {
  const subA = parseMarkdown(MD).children[0].children[1];
  const code = subA.children[4], table = subA.children[5];
  eq(code.type, 'code'); eq(code.line, 15); eq(code.endLine, 17); eq(code.body, 'console.log(1)'); eq(code.info, 'js');
  assert(code.html.startsWith('<pre'), 'code html');
  eq(table.type, 'table'); eq(table.line, 19); eq(table.endLine, 21); assert(table.html.includes('<table'), 'table html');
  eq(subA.subtreeEndLine, 21); eq(subA.line, 7);
});
await test('color markers ({color:} and <!-- color -->)', () => {
  const t = parseMarkdown(MD);
  const subB = t.children[0].children[2];
  eq(subB.text, 'Sub B'); eq(subB.color, '#ff0000');
  const t2 = parseMarkdown('# A\n<!-- color: #00ff00 -->\n- item\n', { rootText: 'r' });
  eq(t2.children[0].children[0].color, '#00ff00');
});
await test('ids are stable when text changes (ancestry index hash)', () => {
  const a = parseMarkdown(MD), b = parseMarkdown(MD.replace('item 1 **bold**', 'renamed'));
  deepEq(flattenTree(a).map(n => n.id), flattenTree(b).map(n => n.id));
  assert(new Set(flattenTree(a).map(n => n.id)).size === flattenTree(a).length, 'ids unique');
});
await test('single H1 promoted to root when no rootText; not when rootText given', () => {
  const md = '# Only\n- a\n- b\n';
  const p = parseMarkdown(md); eq(p.type, 'root'); eq(p.text, 'Only'); eq(p.promoted, true); eq(p.children.length, 2); eq(p.line, 0);
  const q = parseMarkdown(md, { rootText: 'Note' }); eq(q.text, 'Note'); eq(q.children[0].text, 'Only');
});
await test('paragraph lazy continuation and maxDepth', () => {
  const t = parseMarkdown('# H\nline one\nline two\n\n- a\n  - b\n    - c\n', { rootText: 'r' });
  const p = t.children[0].children[0]; eq(p.type, 'paragraph'); eq(p.text, 'line one line two'); eq(p.endLine, 2);
  const shallow = parseMarkdown('# H\n- a\n  - b\n    - c\n', { rootText: 'r', maxDepth: 2 });
  eq(flattenTree(shallow).length, 3);
});
await test('tags / links / badges on nodes', () => {
  const t = parseMarkdown('# H\n- has [[Link|x]] and #t1 and ![[img.png]] and ![[embed]] `c`\n', { rootText: 'r' });
  const n = t.children[0].children[0];
  deepEq(n.tags, ['#t1']); deepEq(n.links, ['Link']);
  for (const b of ['link', 'image', 'embed', 'code']) assert(n.badges.includes(b), 'badge ' + b);
});

// ───────────── inline renderer ─────────────
group('inline renderer');
await test('emphasis, code, strike, highlight', () => {
  const h = renderInline('**b** *i* ~~s~~ ==h== `c`');
  for (const x of ['<strong>b</strong>', '<em>i</em>', '<del>s</del>', '<mark>h</mark>', '<code>c</code>']) assert(h.includes(x), x);
});
await test('wikilinks, aliases, embeds, tags, md links, autolinks', () => {
  const h = renderInline('[[N|x]] [[Other#Head]] ![[i.png]] #tag/sub [l](https://x.y) <https://a.b> https://ex.com/p?a=1&b=2.');
  assert(h.includes('class="internal-link" href="#" data-href="N" data-target="N">x</a>'), 'alias link');
  assert(h.includes('data-href="Other#Head" data-target="Other"'), 'heading link base');
  assert(h.includes('class="mm-embed mm-embed-image"'), 'image embed');
  assert(h.includes('class="tag" href="#" data-tag="#tag/sub">#tag/sub</a>'), 'tag');
  assert(h.includes('class="external-link" href="https://x.y"'), 'md link');
  assert(h.includes('href="https://a.b"'), 'autolink');
  assert(h.includes('href="https://ex.com/p?a=1&amp;b=2"'), 'bare url ' + h);
});
await test('sanitization: html escaped, javascript: urls neutralized', () => {
  const h = renderInline('<script>alert(1)<\/script> [x](javascript:alert(1)) <img src=x onerror=alert(1)>');
  assert(!/<script/.test(h) && h.includes('&lt;script&gt;'), 'script escaped');
  assert(!h.includes('javascript:'), 'js url removed');
  assert(!/<img/.test(h), 'raw img escaped');
});
await test('highlight=false returns escaped plain text', () => eq(renderInline('**b** <i>', { highlight: false }), '**b** &lt;i&gt;'));

// ───────────── extractLinks ─────────────
group('extractLinks');
await test('links, embeds, tags, aliases, frontmatter tags, code ignored', () => {
  const r = extractLinks(MD + '\n![[pic.png]] [[Note#Head]] `[[not]]` #tag2\n```\n[[nope]] #no\n```\n');
  deepEq(r.links, ['Note']); deepEq(r.embeds, ['pic.png']); deepEq(r.tags, ['#tag1', '#tag2', '#a', '#b']);
  eq(r.aliases.alias, 'Note');
});

// ───────────── serializer round trip ─────────────
group('treeToMarkdown');
await test('parse → serialize → parse preserves structure', () => {
  const t = parseMarkdown(MD);
  const md2 = treeToMarkdown(t);
  const t2 = parseMarkdown(md2, { rootText: 'Demo' });
  deepEq(structure(t2), structure(t));
  assert(md2.includes('## Sub B {color:#ff0000}'), 'color marker preserved');
  assert(md2.includes('1. ordered'), 'ordered marker preserved');
});
await test('big map round trip (1500 nodes)', () => {
  const t = parseMarkdown(generateBigMap(1500));
  eq(flattenTree(t).length, 1500);
  const t2 = parseMarkdown(treeToMarkdown(t), { rootText: t.text });
  deepEq(structure(t2), structure(t));
});

// ───────────── edit operations ─────────────
group('edit operations');
const T = parseMarkdown(MD);
const H1 = T.children[0], SUBA = H1.children[1], SUBB = H1.children[2], ITEM1 = SUBA.children[0], ITEM2 = SUBA.children[1];
await test('setNodeText heading / list (keeps checkbox) / paragraph', () => {
  assert(setNodeText(MD, SUBA, 'Renamed').split('\n')[7] === '## Renamed', 'heading');
  assert(setNodeText(MD, ITEM1.children[0], 'todo renamed').split('\n')[9] === '  - [ ] todo renamed', 'list keeps checkbox');
  assert(setNodeText(MD, SUBB.children[0], 'New para').split('\n')[24] === 'New para', 'paragraph');
  assert(setNodeText(MD, SUBB, 'B2').split('\n')[23] === '## B2 {color:#ff0000}', 'color marker kept');
  assert(setNodeText(MD, T, 'New title').split('\n')[1] === 'title: New title', 'synthetic root → frontmatter title');
});
await test('insertChild: heading → sub-heading, list → indented item, level 6 → list, root → H1', () => {
  const a = insertChild(MD, SUBA, 'NEW'); assert(a.includes('| 1 | 2 |\n\n### NEW\n\n## Sub B'), 'sub-heading after subtree\n' + a);
  const b = insertChild(MD, ITEM1, 'KID').split('\n'); eq(b[11], '  - KID');
  const c = insertChild(MD, ITEM2, 'KID2').split('\n'); eq(c[12], '  - KID2');
  const six = parseMarkdown('###### Six\n', { rootText: 'r' }).children[0];
  eq(insertChild('###### Six\n', six, 'x').split('\n')[1], '- x');
  const rootChild = insertChild(MD, T, 'Top'); assert(rootChild.trimEnd().endsWith('\n# Top'), 'root child heading');
  const t2 = parseMarkdown('- a\n- b\n', { rootText: 'r' }); eq(insertChild('- a\n- b\n', t2, 'c').split('\n')[2], '- c');
});
await test('insertSibling: heading / ordered list increments marker', () => {
  const a = insertSibling(MD, SUBA, 'SIB').split('\n'); eq(a[22], ''); eq(a[23], '## SIB'); eq(a[25], '## Sub B {color:#ff0000}');
  const ordered = SUBA.children[2]; const b = insertSibling(MD, ordered, 'three').split('\n'); eq(b[13], '2. three');
  const c = insertSibling(MD, ITEM1, 'after item 1').split('\n'); eq(c[11], '- after item 1'); eq(c[12], '- item 2 `code`');
});
await test('deleteNode removes subtree and collapses blank lines', () => {
  const d = deleteNode(MD, SUBA);
  assert(!d.includes('Sub A') && !d.includes('console.log') && d.includes('## Sub B'), 'subtree gone');
  assert(!/\n\n\n/.test(d), 'no triple blank');
  eq(deleteNode(MD, T), MD, 'root delete is no-op');
  const d2 = deleteNode(MD, ITEM1); assert(!d2.includes('todo child') && d2.includes('- item 2'), 'list subtree');
});
await test('moveNode: list → heading (append), heading → list item (converted), reorder by index, guards', () => {
  const m1 = parseMarkdown(moveNode(MD, ITEM1, SUBB), { rootText: 'Demo' });
  const subB = m1.children[0].children[2]; eq(subB.text, 'Sub B');
  eq(subB.children[1].text, 'item 1 **bold**'); eq(subB.children[1].children.length, 2); eq(subB.children[1].children[0].checked, false);
  eq(m1.children[0].children[1].children[0].text, 'item 2 `code`');
  const m2md = moveNode(MD, SUBB, ITEM2); const m2 = parseMarkdown(m2md, { rootText: 'Demo' });
  const item2 = m2.children[0].children[1].children[1]; eq(item2.text, 'item 2 `code`');
  eq(item2.children[0].text, 'Sub B'); eq(item2.children[0].type, 'list'); eq(item2.children[0].color, '#ff0000'); eq(item2.children[0].children[0].text, 'Para B');
  const m3 = parseMarkdown(moveNode(MD, ITEM2, SUBA, 0), { rootText: 'Demo' });
  eq(m3.children[0].children[1].children[0].text, 'item 2 `code`'); eq(m3.children[0].children[1].children[1].text, 'item 1 **bold**');
  eq(moveNode(MD, SUBA, ITEM1), MD, 'cannot move into own descendant');
  eq(moveNode(MD, T, SUBA), MD, 'cannot move root');
  const m4 = parseMarkdown(moveNode(MD, SUBB, T), { rootText: 'Demo' });
  eq(m4.children[1].text, 'Sub B'); eq(m4.children[1].level, 1, 'heading level fixed up to 1');
  const m5 = parseMarkdown(moveNode(MD, ITEM1, SUBB.children[0]), { rootText: 'Demo' });
  eq(m5.children[0].children[2].children[1].text, 'item 1 **bold**', 'leaf target → sibling after leaf');
});
await test('toggleCheck cycles [ ] → [x] → [ ] and adds a box to plain items', () => {
  const a = toggleCheck(MD, ITEM1.children[0]).split('\n')[9]; eq(a, '  - [x] todo child');
  const b = toggleCheck(MD, ITEM1.children[1]).split('\n')[10]; eq(b, '  - [ ] done child');
  const c = toggleCheck(MD, ITEM1).split('\n')[8]; eq(c, '- [ ] item 1 **bold**');
  eq(toggleCheck(MD, SUBA), MD, 'heading no-op');
});
await test('findNodeById / findNodeAtLine / flattenTree', () => {
  eq(findNodeById(T, ITEM2.id), ITEM2); eq(findNodeById(T, 'nope'), null);
  eq(findNodeAtLine(T, 10).text, 'done child'); eq(findNodeAtLine(T, 16).type, 'code'); eq(findNodeAtLine(T, 7).text, 'Sub A'); eq(findNodeAtLine(T, 2), T);
  eq(flattenTree(T).length, 14);
});

// ───────────── layout ─────────────
group('layout');
const overlaps = nodes => {
  let count = 0;
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j];
    if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y) count++;
  }
  return count;
};
const fakeSize = n => ({ w: 40 + (n.text.length % 7) * 12, h: 18 + (n.depth % 3) * 6 });
for (const direction of ['right', 'left', 'both', 'down']) {
  await test(`no overlapping nodes (direction=${direction}, 400 nodes)`, () => {
    const t = parseMarkdown(generateBigMap(400, 11));
    const res = layoutTree(t, { direction, spacingVertical: 5, spacingHorizontal: 80, size: fakeSize, isExpanded: () => true });
    eq(res.nodes.length, 400); eq(overlaps(res.nodes), 0); assert(res.width > 0 && res.height > 0, 'bounds');
    if (direction === 'both') assert(res.nodes.some(n => n.side === 'left') && res.nodes.some(n => n.side === 'right'), 'both sides used');
    if (direction === 'down') assert(res.nodes.every(n => n.side === 'down'), 'down side');
  });
}
await test('collapsed subtrees are not laid out', () => {
  const t = parseMarkdown(MD);
  const res = layoutTree(t, { direction: 'right', spacingVertical: 5, spacingHorizontal: 80, size: fakeSize, isExpanded: n => n.text !== 'Sub A' });
  eq(res.nodes.length, 14 - 8); assert(res.nodes.find(n => n.text === 'Sub A').expanded === false);
});
await test('layout is O(n)-ish: 1500 nodes under 50 ms', () => {
  const t = parseMarkdown(generateBigMap(1500));
  const t0 = performance.now();
  layoutTree(t, { direction: 'right', spacingVertical: 5, spacingHorizontal: 80, size: fakeSize, isExpanded: () => true });
  const ms = performance.now() - t0; assert(ms < 50, `took ${ms.toFixed(1)} ms`);
});

// ───────────── MindMapView ─────────────
group('MindMapView');
const mmEl = document.getElementById('mm');
const mm = new MindMapView(mmEl, { animationDuration: 0, virtualize: true });
const events = [];
for (const ev of ['node:toggle', 'node:edit', 'node:add-child', 'node:add-sibling', 'node:delete', 'node:move', 'node:check', 'link:click', 'selection:change', 'node:contextmenu']) mm.on(ev, p => events.push([ev, p]));
await test('setData renders nodes, links, ARIA tree', () => {
  mm.setData(parseMarkdown(MD));
  const s = mm.getStats(); eq(s.nodes, 14); eq(s.visible, 14); eq(s.rendered, 14);
  eq(mmEl.querySelectorAll('.mm-node').length, 14); eq(mmEl.querySelectorAll('.mm-link').length, 13);
  eq(mm.getSVG().getAttribute('role'), 'tree'); eq(mmEl.querySelector('.mm-node').getAttribute('role'), 'treeitem');
  assert(mmEl.querySelector('.mm-node.has-children .mm-toggle'), 'toggle circle');
  assert(mmEl.querySelector('.mm-node.is-todo .mm-check'), 'checkbox badge'); assert(mmEl.querySelector('a.tag'), 'tag pill');
  assert(mmEl.querySelector('.mm-node.is-code .mm-pre'), 'code node'); assert(mmEl.querySelector('.mm-node.is-table table'), 'table node');
});
await test('depth colors + thickness + freeze level + colorByTag + data-type', () => {
  const t = parseMarkdown(MD); mm.setData(t);
  const link = id => mmEl.querySelector(`.mm-link[data-id="${id}"]`);
  eq(link(H1.id) && link(t.children[0].id).getAttribute('stroke'), '#fed766'); eq(link(t.children[0].id).getAttribute('stroke-width'), '10');
  eq(link(t.children[0].children[1].id).getAttribute('stroke'), '#2ab7ca'); eq(link(t.children[0].children[1].children[0].id).getAttribute('stroke'), '#fe4a49');
  eq(link(t.children[0].children[1].children[0].children[0].id).getAttribute('stroke'), '#000');
  mm.setOptions({ colorFreezeLevel: 2 }); eq(link(t.children[0].children[1].children[0].children[0].id).getAttribute('stroke'), '#2ab7ca');
  mm.setOptions({ colorFreezeLevel: 0, colorByTag: { '#tag1': '#123456' } });
  eq(link(t.children[0].children[0].id).getAttribute('stroke'), '#123456'); eq(link(t.children[0].children[0].id).getAttribute('data-type'), 'tag');
  eq(link(t.children[0].children[2].id).getAttribute('stroke'), '#ff0000', 'explicit node color');
  mm.setOptions({ colorByTag: {} });
});
await test('toggleNode / expandAll / collapseAll / expandToLevel / initialExpandLevel / keepState', () => {
  mm.toggleNode(SUBA.id); assert(mm.isCollapsed(SUBA.id)); eq(mm.getStats().visible, 6); eq(events.filter(e => e[0] === 'node:toggle').length, 1);
  assert(mmEl.querySelector(`.mm-node[data-id="${SUBA.id}"]`).classList.contains('is-collapsed'));
  mm.setData(parseMarkdown(MD), { keepState: true }); assert(mm.isCollapsed(SUBA.id), 'keepState keeps collapse'); eq(mm.getStats().visible, 6);
  mm.expandAll(); eq(mm.getStats().visible, 14);
  mm.collapseAll(); eq(mm.getStats().visible, 2);
  mm.expandToLevel(2); eq(mm.getStats().visible, 5);
  mm.setOptions({ initialExpandLevel: 1 }); mm.setData(parseMarkdown(MD)); eq(mm.getStats().visible, 2);
  mm.setOptions({ initialExpandLevel: -1 }); mm.setData(parseMarkdown(MD)); eq(mm.getStats().visible, 14);
});
await test('highlight returns match count, dims others, reveals collapsed matches', () => {
  mm.collapseAll();
  eq(mm.highlight('child'), 2);
  eq(mmEl.querySelectorAll('.mm-node.is-match').length, 2); assert(mmEl.querySelectorAll('.mm-node.is-dimmed').length > 5, 'dimmed');
  eq(mm.highlight(/^ordered/), 2); eq(mm.highlight(null), 0); eq(mmEl.querySelectorAll('.mm-node.is-dimmed').length, 0);
});
await test('select / navigate / keyboard keys emit events', () => {
  mm.expandAll(); mm.select(mm.tree.id); eq(mm.getSelection(), mm.tree.id);
  mm.navigate('right'); eq(mm.getNode(mm.getSelection()).text, 'Heading 1');
  mm.navigate('right'); mm.navigate('down'); eq(mm.getNode(mm.getSelection()).text, 'Sub A');
  mm.navigate('left'); eq(mm.getNode(mm.getSelection()).text, 'Heading 1');
  const key = (k, init = {}) => mm.getSVG().dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...init }));
  mm.select(SUBA.id);
  const before = events.length;
  key('Tab'); key('Enter'); key('Delete'); key(' ');
  const kinds = events.slice(before).map(e => e[0]);
  // Enter and Tab both create a child on a selected node (sibling creation happens from a NEW node's editor via Enter)
  assert(kinds.filter(k => k === 'node:add-child').length >= 2 && !kinds.includes('node:add-sibling') && kinds.includes('node:delete') && kinds.includes('node:toggle'), kinds.join(','));
  key('Escape'); eq(mm.getSelection(), null);
  assert(mmEl.querySelector('.mm-live').getAttribute('aria-live') === 'polite', 'live region');
});
await test('click toggle / wikilink / tag / checkbox delegation', () => {
  mm.expandAll();
  const before = events.length;
  mmEl.querySelector('.mm-check').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
  mmEl.querySelector('a.internal-link').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));

  const r6 = await importFile(new File(['Top\n\tkid'], 'plain.txt')); eq(r6.markdown, '# Top\n- kid\n');
  const r7 = await importFile(new File(['<map version="1.0"><node TEXT="m"/></map>'], 'weird.xml')); eq(r7.markdown, '# m\n');
  const r8 = await importFile(new File([XMIND_JSON], 'sheet.json')); assert(r8.markdown.startsWith('# Central'));
});

// ───────────── summary ─────────────
const total = results.pass + results.fail;
const sum = document.getElementById('summary');
sum.textContent = `${results.pass} PASS / ${results.fail} FAIL (of ${total})`;
sum.className = results.fail ? 'bad' : 'ok';
document.title = `${results.fail ? 'FAIL' : 'PASS'} ${results.pass}/${total} — Engine tests`;
window.__results = results;
console.log('TESTS DONE', JSON.stringify(results));
</script>
